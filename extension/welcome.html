<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resource Timer for OGame</title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="pages.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { padding: 40px 16px; }
    main { max-width: 640px; margin: 0 auto; display: grid; gap: 20px; }
    .header img { width: 72px; height: 72px; }
    h1 { font-size: 22px; }
    h2 { font-size: 14px; margin-bottom: 4px; }
    .story { font-size: 14px; color: #c8d0d8; font-style: italic; }
    /* Static preview of the in-game line and tooltip */
    .demo { position: relative; padding: 14px 14px 130px; }
    .demo-info { color: #848e98; line-height: 21px; }
    .demo-info strong { color: #fff; }
    .demo #ogw-tooltip { display: block; position: absolute; left: 120px; top: 50px; }
    .demo #ogw-tooltip::after { top: -7px; bottom: auto; border-top: 0; border-bottom: 7px solid #47566a; left: 14px; }
    .support { display: grid; gap: 8px; max-width: 320px; }
  </style>
</head>
<body>
  <main>
    <div class="header">
      <img src="icons/icon-128.png" alt="">
      <div>
        <h1 data-i18n="welcome"></h1>
        <div data-i18n="tagline"></div>
      </div>
    </div>

    <p class="story" data-i18n="story"></p>

    <div class="panel demo" aria-hidden="true">
      <div class="demo-info" id="demo-info"></div>
      <div id="ogw-tooltip"></div>
    </div>

    <div class="panel">
      <h2 data-i18n="howTitle"></h2>
      <ol>
        <li data-i18n="how1"></li>
        <li data-i18n="how2"></li>
        <li data-i18n="how3"></li>
      </ol>
    </div>

    <div class="support">
      <a class="support-btn" id="support">❤ <span data-i18n="support"></span></a>
      <div class="note" data-i18n="supportNote"></div>
    </div>

    <div class="footer">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      <a data-repo="" target="_blank" rel="noopener" data-i18n="source"></a>
      <span>·</span>
      <a data-repo="/issues" target="_blank" rel="noopener" data-i18n="bug"></a>
    </div>
    <div class="muted" data-i18n="unofficial"></div>
  </main>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="ui-strings.js"></script>
  <script src="welcome.js"></script>
</body>
</html>
