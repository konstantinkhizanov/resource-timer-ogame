<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Support Resource Timer</title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="pages.css">
  <style>
    body { padding: 40px 16px; }
    main { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; }
    .header img { width: 64px; height: 64px; }
    h1 { font-size: 22px; }
    .intro { margin: 0; font-size: 14px; color: #c8d0d8; }
    .option {
      display: flex; align-items: center; gap: 14px;
      text-decoration: none; color: var(--text);
      transition: border-color .15s, transform .15s;
    }
    a.option:hover { border-color: var(--accent); transform: translateY(-1px); }
    .option .icon {
      flex: none; width: 44px; height: 44px; border-radius: 10px;
      display: grid; place-items: center; font-size: 22px;
    }
    .option h2 { font-size: 15px; color: var(--strong); display: flex; align-items: center; gap: 8px; }
    .option p { margin: 2px 0 0; font-size: 12px; }
    .option .go { margin-left: auto; color: var(--accent); font-size: 20px; }
    .badge {
      font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: .5px;
      color: #10260a; background: var(--accent); border-radius: 3px; padding: 1px 6px;
    }
    .kofi .icon { background: linear-gradient(#ffad33, #e07f00); }
    .paypal .icon { background: linear-gradient(#2a7fd4, #0b4a8f); }
    .crypto .icon { background: linear-gradient(#f7a83b, #c46f0a); align-self: flex-start; }
    .crypto { flex-wrap: wrap; }
    .crypto .body { flex: 1; min-width: 0; }
    .wallet-row { margin-top: 10px; }
    .wallet-row .coin { color: var(--strong); font-weight: bold; }
    .wallet-row .net { font-size: 11px; }
    .wallet { display: flex; gap: 8px; margin-top: 4px; }
    .wallet code {
      flex: 1; min-width: 0; overflow-wrap: anywhere;
      background: #0f151d; color: var(--strong); border: 1px solid var(--border);
      border-radius: 4px; padding: 6px 8px; font-size: 12px;
    }
    .wallet button {
      flex: none; cursor: pointer; font: inherit; font-size: 12px; font-weight: bold;
      color: var(--strong); background: #24303e; border: 1px solid var(--border); border-radius: 4px; padding: 0 12px;
    }
    .wallet button:hover { border-color: var(--accent); }
    .warn { color: #d9a441; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="header">
      <img src="icons/icon-128.png" alt="">
      <h1 data-i18n="sTitle"></h1>
    </div>
    <p class="intro" data-i18n="sIntro"></p>

    <a class="panel option kofi" id="kofi" target="_blank" rel="noopener">
      <div class="icon">☕</div>
      <div>
        <h2><span data-i18n="sKofi"></span> <span class="badge" data-i18n="sRec"></span></h2>
        <p data-i18n="sKofiDesc"></p>
      </div>
      <span class="go">›</span>
    </a>

    <a class="panel option paypal" id="paypal" target="_blank" rel="noopener">
      <div class="icon">P</div>
      <div>
        <h2 data-i18n="sPaypal"></h2>
        <p data-i18n="sPaypalDesc"></p>
      </div>
      <span class="go">›</span>
    </a>

    <div class="panel option crypto" id="crypto">
      <div class="icon">₿</div>
      <div class="body">
        <h2 data-i18n="sCrypto"></h2>
        <div id="wallets"></div>
        <p class="warn" data-i18n="sCryptoWarn"></p>
      </div>
    </div>

    <div class="footer">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      <a data-repo="" target="_blank" rel="noopener" data-i18n="source"></a>
      <span>·</span>
      <a data-repo="/issues" target="_blank" rel="noopener" data-i18n="bug"></a>
    </div>
    <div class="muted" data-i18n="unofficial"></div>
  </main>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="ui-strings.js"></script>
  <script src="support.js"></script>
</body>
</html>
